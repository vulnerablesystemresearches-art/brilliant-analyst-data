name: Poll Live Prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-prices
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run poller
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: node poll.js

      - name: Commit and push updated price data
        run: |
          git config user.name "price-poller-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: poll live prices [skip ci]"
            git push
          fi
